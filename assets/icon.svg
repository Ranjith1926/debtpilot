<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Top glow -->
    <radialGradient id="glowGrad" cx="30%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass top highlight -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Letter gradient: white to cyan tint -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <!-- Accent arrow gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Soft shadow under letters -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background (iOS-style squircle approximation) -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bgGrad)"/>

  <!-- Inner top glow -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#glowGrad)"/>

  <!-- Glass top highlight -->
  <rect width="1024" height="560" rx="230" ry="230" fill="url(#glassGrad)"/>

  <!-- Subtle inner border -->
  <rect x="6" y="6" width="1012" height="1012" rx="226" ry="226" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- ── Main mark: "DP" monogram, bold and premium ── -->
  <g filter="url(#softShadow)">
    <!-- "D" letter -->
    <path
      d="M 220 280
         L 440 280
         Q 620 280, 620 512
         Q 620 744, 440 744
         L 220 744
         Z
         M 360 410
         L 360 614
         L 430 614
         Q 480 614, 480 512
         Q 480 410, 430 410
         Z"
      fill="url(#letterGrad)"
      fill-rule="evenodd"
    />

    <!-- "P" letter -->
    <path
      d="M 650 280
         L 870 280
         Q 950 280, 950 410
         Q 950 540, 870 540
         L 790 540
         L 790 744
         L 650 744
         Z
         M 790 410
         L 790 410
         L 790 410
         Z"
      fill="url(#letterGrad)"
    />
    <!-- P inner shape (counter) -->
    <rect x="790" y="410" width="50" height="0" fill="url(#bgGrad)"/>
    <path
      d="M 790 410
         L 850 410
         Q 880 410, 880 475
         Q 880 540, 850 540
         L 790 540
         Z"
      fill="url(#bgGrad)"
    />
  </g>

  <!-- ── Accent: small upward arrow indicator (financial growth) ── -->
  <g transform="translate(820, 760)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="60" fill="url(#accentGrad)"/>
    <path
      d="M -22 14 L 0 -14 L 22 14"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <line x1="0" y1="-14" x2="0" y2="18" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
